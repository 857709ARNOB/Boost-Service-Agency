<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Boost Service Agency</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #fff; font-family: Arial, sans-serif;
    }
    .app-frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block; background: #fff;
    }
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #fff;
      transition: opacity .25s ease;
    }
    .spinner {
      width: 42px; height: 42px; border: 4px solid #e8e8e8;
      border-top-color: #1a73e8; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-text { font-size: 14px; color: #666; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading application...</div>
  </div>

  <iframe
    id="appFrame"
    class="app-frame"
    title="Boost Service Agency"
    src="https://script.google.com/macros/s/AKfycbxx069p4mj7415dIJgOpK9r1MKx7C9ENzsgDeWZAc6YhyW02T4BEkP9BQfogZAYQWwdAg/exec"
    allow="clipboard-read; clipboard-write; camera; microphone; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads">
  </iframe>

  <script>
    const frame = document.getElementById("appFrame");
    const loader = document.getElementById("loader");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loader.classList.add("hidden");
        setTimeout(function () { loader.remove(); }, 300);
      }, 500);
    });
  </script>
</body>
</html>
